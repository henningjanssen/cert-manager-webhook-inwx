version: 2

updates:
  # Go modules — one go.mod per tool under tools/.
  - package-ecosystem: gomod
    directories:
      - '/tools/*'
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    labels:
      - dependencies
    groups:
      go-dependencies:
        patterns:
          - '*'

  # Dockerfile base images.
  - package-ecosystem: docker
    directories:
      - '/tools/*'
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    labels:
      - dependencies
    groups:
      docker-base-images:
        patterns:
          - '*'

  # GitHub Actions used by the shared workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'
