name: Snapshot

# Keeps the moving main / dev image and chart tags up to date for changed tools.
on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

# shortcut: GitHub keeps one pending run per group, so a burst of pushes can skip a commit's tool until it next changes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Publish changed tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools via mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Part of the build's inputs, so pinned for reproducibility.
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Publish affected tools
        env:
          BRANCH_TAG: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A new branch has no "before" commit.
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || BEFORE="$(git rev-parse HEAD~1)"
          moon exec --ignore-ci-checks --affected --base "$BEFORE" --head HEAD \
            :publish-image :publish-chart
