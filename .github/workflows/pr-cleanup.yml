name: PR Cleanup

# Deletes a closed or merged PR's preview artifacts. Same concurrency group as
# pr-preview.yml, so a preview still running is cancelled first.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  packages: write

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Delete PR preview artifacts
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # The PR's own tree, so a tool the PR introduced is cleaned up too.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Delete artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.number }}
        run: bash scripts/cleanup-pr.sh
