name: PR Preview

# Publishes pr-<n> images and 0.0.0-pr<n> charts for the tools a PR changes.
# pr-cleanup.yml removes them when the PR closes.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Publish changed tools
    runs-on: ubuntu-latest
    # Fork PRs can't write packages with GITHUB_TOKEN.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools via mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Part of the build's inputs, so pinned for reproducibility.
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Publish affected tools
        env:
          PR_NUMBER: ${{ github.event.number }}
          BASE_REF: ${{ github.base_ref }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          moon exec --ignore-ci-checks --affected \
            --base "$(git merge-base "origin/$BASE_REF" HEAD)" --head HEAD \
            :publish-image :publish-chart
